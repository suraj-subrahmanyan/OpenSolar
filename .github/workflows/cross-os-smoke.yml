name: cross-os-smoke
# Autonomous cross-OS proof that a BRAND-NEW MACHINE can install Solar and run the real commands.
# Historically the functional check-suite ran ubuntu-only, so "CI green" hid macOS / Windows-WSL breakage.
# This runs the full new-machine command battery (scripts/ci-os-fullcheck.sh: solar harness, solar status,
# install->doctor->status-server HTTP contract->uninstall, offline solar update, dashboard /intake) on every
# OS. DETERMINISTIC, NO LIVE LLM (no Claude/Codex auth on hosted runners) -> asserts the command + HTTP
# plumbing up to the auth boundary, never a live plan/deliverable. macOS+Linux native; Windows is WSL2.
# Public repo => standard runners FREE on all OSes; matrix fail-fast=false so EVERY OS reports its own breakage.
on:
  workflow_dispatch:
    inputs:
      intake_task:
        description: "intake task text to POST"
        default: "Write a one-line hello-world note."
  push:
    branches: [ci/cross-os-smoke]
  schedule:
    - cron: "17 6 * * *"   # nightly autonomous run (UTC)
permissions:
  contents: read
jobs:
  unix-smoke:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Provision a set-up machine (deps a real install/user has)
        run: |
          # macOS ships bash 3.2 + no tmux; a real macOS user `brew install`s them.
          if [ "$(uname -s)" = "Darwin" ]; then brew install tmux bash || true; fi
          # Install the harness py-deps into the base interpreter so the deps-light
          # `solar update` check (check-update.sh) sees them — a real installed machine has them.
          python3 -m pip install -r requirements/harness.txt
      - name: New-machine command battery (native unix)
        env:
          INTAKE_TASK: ${{ github.event.inputs.intake_task || 'Write a one-line hello-world note.' }}
        run: bash scripts/ci-os-fullcheck.sh
  windows-wsl2-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Provision WSL2 Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
          # The minimal WSL image lacks jq + python3-pip (hosted ubuntu/macos runners pre-install them).
          # yaml/jsonschema/rich come with the base python3 via apt; only pydantic is missing, so pull it
          # from apt (python3-pydantic) — a system-site pip install of it conflicts with the apt-managed
          # typing-extensions ("Cannot uninstall ... installed by debian"). The per-check installs use
          # pip --user (no conflict) via the hardened py-deps.sh; check-update (deps-light) needs only the
          # ambient pydantic that apt provides.
          additional-packages: python3 python3-pip python3-pydantic curl git jq ca-certificates
      - name: Clone in WSL (LF, no Windows CRLF) + run the real command battery
        shell: pwsh
        run: |
          # Clone INSIDE WSL so git uses Unix line endings (the Windows checkout converts LF->CRLF, breaking bash).
          # SOLAR_BIND_HOST=127.0.0.1: by default the server binds 0.0.0.0 under WSL (NAT localhostForwarding
          # workaround). On the GHA windows-WSL runner that 0.0.0.0 path goes through a localhost relay that
          # injects 403s (Solar itself never returns 403). Pinning loopback is the override the code documents
          # as the secure path and makes WSL bind exactly like the green ubuntu/macos jobs.
          wsl -d Ubuntu-24.04 -- bash -lc 'set -e; export SOLAR_BIND_HOST=127.0.0.1; git clone --depth 1 --branch ci/cross-os-smoke https://github.com/suraj-subrahmanyan/OpenSolar.git "$HOME/solar"; cd "$HOME/solar"; bash scripts/ci-os-fullcheck.sh'
