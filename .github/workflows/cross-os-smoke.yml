name: cross-os-smoke
# On-demand + on-push cross-OS smoke: install -> status-server boots -> GET /status -> POST /intake creates
# a sprint RECORD (file plumbing). DETERMINISTIC, NO LIVE LLM (no auth on hosted runners). macOS+Linux native
# (install.sh); Windows is WSL2 (install.ps1 is a WSL bootstrapper). Public repo => runners free on all OSes.
on:
  workflow_dispatch:
    inputs:
      intake_task:
        description: "intake task text to POST"
        default: "Write a one-line hello-world note."
  push:
    branches: [ci/cross-os-smoke]
permissions:
  contents: read
jobs:
  unix-smoke:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Solar (native unix; flags per smoke-install-matrix)
        run: bash install.sh --yes --components kernel,harness --fake-keys --skip-llm-cli
      - name: Cross-OS smoke (status-server + /status + /intake)
        env:
          INTAKE_TASK: ${{ github.event.inputs.intake_task || 'Write a one-line hello-world note.' }}
        run: bash scripts/ci-os-smoke.sh "$INTAKE_TASK"
  windows-wsl2-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Provision WSL2 Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
          additional-packages: python3 curl
      - name: Copy checkout into WSL, install, run the smoke
        shell: pwsh
        run: |
          # forward-slash the Windows path so backslashes survive the pwsh -> wsl -> bash boundary
          $ws = ($env:GITHUB_WORKSPACE -replace '\\','/')
          $wslPath = (wsl -d Ubuntu-24.04 -- wslpath -a "$ws").Trim()
          Write-Host "workspace=$ws  wslPath=$wslPath"
          wsl -d Ubuntu-24.04 -- bash -lc "set -e; cp -r '$wslPath' ~/solar; cd ~/solar; ./install.sh --yes --components kernel,harness --fake-keys --skip-llm-cli; bash scripts/ci-os-smoke.sh 'Write a one-line hello-world note.'"
