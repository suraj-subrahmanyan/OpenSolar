name: cross-os-smoke
# Autonomous cross-OS smoke: install -> status-server boots -> GET /status -> POST /intake creates a sprint
# RECORD (file plumbing). DETERMINISTIC, NO LIVE LLM (no Claude/Codex auth on hosted runners) -> /intake only
# asserts status.json was written, never a plan/deliverable. macOS+Linux native (install.sh); Windows is WSL2
# (install.ps1 is a WSL bootstrapper). Runs on push to this branch, on a nightly cron, and on demand.
# Public repo => standard runners are FREE on all OSes; matrix fail-fast=false so every OS reports.
on:
  workflow_dispatch:
    inputs:
      intake_task:
        description: "intake task text to POST"
        default: "Write a one-line hello-world note."
  push:
    branches: [ci/cross-os-smoke]
  schedule:
    - cron: "17 6 * * *"   # nightly autonomous run (UTC)
permissions:
  contents: read
jobs:
  unix-smoke:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Solar (native unix; flags per smoke-install-matrix)
        run: bash install.sh --yes --components kernel,harness --fake-keys --skip-llm-cli
      - name: Cross-OS smoke (status-server + /status + /intake)
        env:
          INTAKE_TASK: ${{ github.event.inputs.intake_task || 'Write a one-line hello-world note.' }}
        run: bash scripts/ci-os-smoke.sh "$INTAKE_TASK"
  windows-wsl2-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Provision WSL2 Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
          additional-packages: python3 curl git ca-certificates
      - name: Clone in WSL (LF, no Windows CRLF) + install + smoke
        shell: pwsh
        run: |
          # Clone INSIDE WSL so git uses Unix line endings (the Windows checkout converts LF->CRLF and breaks bash).
          wsl -d Ubuntu-24.04 -- bash -lc 'set -e; git clone --depth 1 --branch ci/cross-os-smoke https://github.com/suraj-subrahmanyan/OpenSolar.git "$HOME/solar"; cd "$HOME/solar"; ./install.sh --yes --components kernel,harness --fake-keys --skip-llm-cli; bash scripts/ci-os-smoke.sh "Write a one-line hello-world note."'
